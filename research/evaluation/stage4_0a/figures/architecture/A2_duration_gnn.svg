<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="880" height="276" role="img" aria-label="E4-E6  DurationGNN (55,617 parameters) and NodeMLP control" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="880" height="276" fill="#fcfcfb"/>
<text x="16" y="24" font-size="15" font-weight="700" fill="#0b0b0b">E4-E6  DurationGNN (55,617 parameters) and NodeMLP control</text>
<line x1="206" y1="82" x2="238" y2="82" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="380" y1="82" x2="412" y2="82" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="644" y1="82" x2="676" y2="82" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="50" width="190" height="64" rx="6" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.4"/>
<text x="111.0" y="72.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">22 node features</text>
<text x="111.0" y="86.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">CPM, degree, depth,</text>
<text x="111.0" y="100.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">12 trade one-hot</text>
<rect x="240" y="50" width="140" height="64" rx="6" fill="#ffffff" stroke="#b9b8b2" stroke-width="1.4"/>
<text x="310.0" y="79.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">Encoder</text>
<text x="310.0" y="93.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">Linear 22-&gt;64, ReLU</text>
<rect x="414" y="40" width="230" height="84" rx="6" fill="#fdeee6" stroke="#eb6834" stroke-width="1.4"/>
<text x="529.0" y="65.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">x3 layers:</text>
<text x="529.0" y="79.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">SAGEConv(pred-&gt;succ)</text>
<text x="529.0" y="93.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">+ SAGEConv(succ-&gt;pred)</text>
<text x="529.0" y="107.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">ReLU, dropout 0.1, +skip, LayerNorm</text>
<rect x="678" y="50" width="186" height="64" rx="6" fill="#e8f7f1" stroke="#1baf7a" stroke-width="1.4"/>
<text x="771.0" y="79.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">Head 64-&gt;64-&gt;1</text>
<text x="771.0" y="93.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">log(actual/planned)</text>
<rect x="240" y="150" width="404" height="50" rx="6" fill="#f4f3f0" stroke="#d6d5d0" stroke-width="1.4"/>
<text x="442.0" y="179.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">NodeMLP control: Linear 22-&gt;64, ReLU, dropout, Linear 64-&gt;64, ReLU, Linear 64-&gt;1 (no message passing)</text>
<text x="16" y="226" font-size="11" fill="#52514e">AdamW lr 3e-3, weight decay 1e-4, Huber(delta 0.5), one graph per step; epochs 150 (synthetic) / 200 (DSLIB), patience 30, seed 42+fold.</text>
<text x="16" y="244" font-size="11" fill="#52514e">Saved model.pt = refit on all projects for median CV best epoch (not the fold models that produced the OOF metrics).</text>
</svg>