<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 212" width="880" height="212" role="img" aria-label="E8  CambridgeSAGE (46,465 parameters; identical no-graph arm with empty edge set)" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="880" height="212" fill="#fcfcfb"/>
<text x="16" y="24" font-size="15" font-weight="700" fill="#0b0b0b">E8  CambridgeSAGE (46,465 parameters; identical no-graph arm with empty edge set)</text>
<line x1="216" y1="88" x2="248" y2="88" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="400" y1="88" x2="432" y2="88" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="670" y1="88" x2="702" y2="88" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="16" y="50" width="200" height="76" rx="6" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.4"/>
<text x="116.0" y="78.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">TF-IDF -&gt; SVD128 -&gt; scaler</text>
<text x="116.0" y="92.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">+ one-hot type/region</text>
<text x="116.0" y="106.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">= 139 node inputs</text>
<rect x="250" y="56" width="150" height="64" rx="6" fill="#ffffff" stroke="#b9b8b2" stroke-width="1.4"/>
<text x="325.0" y="78.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">Encoder</text>
<text x="325.0" y="92.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">Linear 139-&gt;64</text>
<text x="325.0" y="106.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">ReLU, dropout 0.2</text>
<rect x="434" y="40" width="236" height="96" rx="6" fill="#fdeee6" stroke="#eb6834" stroke-width="1.4"/>
<text x="552.0" y="64.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">x2 layers:</text>
<text x="552.0" y="78.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">SAGEConv mean (pred-&gt;succ)</text>
<text x="552.0" y="92.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">+ SAGEConv mean (succ-&gt;pred)</text>
<text x="552.0" y="106.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">ReLU, dropout, residual,</text>
<text x="552.0" y="120.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">LayerNorm</text>
<rect x="704" y="56" width="160" height="64" rx="6" fill="#e8f7f1" stroke="#1baf7a" stroke-width="1.4"/>
<text x="784.0" y="85.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">Head 64-&gt;64-&gt;1</text>
<text x="784.0" y="99.0" font-size="11.5" text-anchor="middle" fill="#0b0b0b">log1p(days)</text>
<text x="16" y="162" font-size="11" fill="#52514e">AdamW lr 3e-3, wd 1e-4, L1 on log1p(days), batch 8 graphs; max 150 epochs, patience 15 on inner-stopping blocks, best restored.</text>
<text x="16" y="180" font-size="11" fill="#52514e">Seeds 23051-23053 per fold; primary prediction = mean of log predictions over seeds, expm1, clip at 0.</text>
</svg>